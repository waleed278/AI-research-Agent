[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Production-grade autonomous research & report agent: FastAPI + OpenAI tool-calling agent, async job queue, and an offline eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "openai>=1.54.0",
    "google-genai>=0.3.0",
    "anthropic>=0.39.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "pypdf>=5.0.0",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "sse-starlette>=2.1.0",
    "python-json-logger>=2.0.7",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped so the session-scoped `db_engine` fixture (tests/integration/conftest.py)
# and every async test run on the *same* event loop -- asyncpg connections are bound to
# the loop they were created on, so a per-test loop (pytest-asyncio's default) breaks a
# session-scoped async engine with "another operation is in progress" errors.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
