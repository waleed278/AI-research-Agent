name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: research_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d research_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://agent:agent@localhost:5432/research_agent_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Unit + integration tests
        run: uv run pytest -q --cov=app --cov-report=term-missing

      - name: Eval harness smoke test (offline, no API keys, zero cost)
        run: uv run python -m evals.run_evals --mock --fail-under 0.0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx eslint .

      - name: Unit + component tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # Runs the real eval suite against live OpenAI/Tavily APIs. Deliberately
  # NOT run on every push -- it spends real API budget and is slower than a
  # normal CI gate should be. Trigger manually (Actions tab -> Run workflow)
  # before merging a prompt or model change, or add a `schedule:` trigger
  # above once you have a budget to dedicate to a nightly run.
  eval-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run live eval suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SEARCH_PROVIDER: tavily
        run: uv run python -m evals.run_evals --fail-under 0.8
