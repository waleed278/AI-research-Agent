server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any non-file route falls back to index.html so
    # client-side routing (if added later) doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin reverse proxy to the API -- this is what lets the deployed
    # app avoid CORS entirely (see docs/decisions/0007-frontend-sse-and-proxy.md):
    # the browser only ever talks to this nginx origin.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The research-jobs/{id}/events endpoint is a long-lived
        # Server-Sent Events stream -- nginx buffers upstream responses by
        # default, which would hold every event until the buffer filled
        # instead of forwarding it immediately. Disabling buffering and
        # raising the read timeout past the backend's own job timeout
        # keeps the stream live end-to-end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        chunked_transfer_encoding off;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }

    location = /readyz {
        proxy_pass http://api:8000/readyz;
    }
}
